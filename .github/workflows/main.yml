name: Fetch and Commit Taskbar to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and extract farmerbb/Taskbar to root
        run: |
          curl -L https://github.com/farmerbb/Taskbar/archive/refs/heads/master.zip -o Taskbar-master.zip
          unzip -q Taskbar-master.zip
          cp -rf Taskbar-master/. .
          rm -rf Taskbar-master Taskbar-master.zip

      - name: Commit and push files to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Taskbar source files to root" || echo "No changes to commit"
          git push
          
