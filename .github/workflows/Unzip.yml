name: Unzip File to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and flatten Taskbar-master.zip to Root
        run: |
          unzip -o Taskbar-master.zip
          shopt -s dotglob
          mv Taskbar-master/* .
          rm -rf Taskbar-master Taskbar-master.zip

      - name: Verify extracted files in Root
        run: ls -la
        
