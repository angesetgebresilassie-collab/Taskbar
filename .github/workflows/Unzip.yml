name: Unzip Farmerbb Taskbar to Root

on: [push, workflow_dispatch]

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Fetch and extract farmerbb/Taskbar to root
        run: |
          curl -L https://github.com/farmerbb/Taskbar/archive/refs/heads/master.zip -o Taskbar-master.zip
          bsdtar -xvf Taskbar-master.zip --strip-components=1 -C .
          rm Taskbar-master.zip

      - name: Verify files at root
        run: ls -la
        
