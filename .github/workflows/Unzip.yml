name: Extract Local Taskbar-master.zip

on: [push, workflow_dispatch]

jobs:
  extract-local-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Unpack Taskbar-master.zip to root
        run: |
          bsdtar -xvf Taskbar-master.zip --strip-components=1 -C .
          rm Taskbar-master.zip

      - name: Verify files at root
        run: ls -la
        
