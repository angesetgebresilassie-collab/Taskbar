name: Fetch and Unzip Taskbar to Root

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and extract farmerbb/Taskbar to root
        run: |
          curl -L https://github.com/farmerbb/Taskbar/archive/refs/heads/master.zip -o Taskbar-master.zip
          unzip -q Taskbar-master.zip
          shopt -s dotglob
          mv Taskbar-master/* .
          rm -rf Taskbar-master Taskbar-master.zip

      - name: Verify files at root
        run: ls -la
        
