name: Apply macOS Freeform UI & Logic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-mac-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create, Execute, and Clean Up Script
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/farmerbb/taskbar/util

          cat << 'EOT' > app/src/main/res/drawable/mac_header_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#CC1C1C1E" />
              <corners android:topLeftRadius="10dp" android:topRightRadius="10dp" />
          </shape>
          EOT

          cat << 'EOT' > app/src/main/res/drawable/mac_btn_close.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FF5F56" />
              <stroke android:width="1dp" android:color="#E0443E" />
          </shape>
          EOT

          cat << 'EOT' > app/src/main/res/drawable/mac_btn_minimize.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFBD2E" />
              <stroke android:width="1dp" android:color="#DEA123" />
          </shape>
          EOT

          cat << 'EOT' > app/src/main/res/drawable/mac_btn_maximize.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#27C93F" />
              <stroke android:width="1dp" android:color="#1AAB29" />
          </shape>
          EOT

          cat << 'EOT' > app/src/main/res/layout/caption.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="38dp"
              android:background="@drawable/mac_header_bg"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:paddingStart="12dp"
              android:paddingEnd="12dp">

              <ImageView
                  android:id="@+id/close_button"
                  android:layout_width="12dp"
                  android:layout_height="12dp"
                  android:background="@drawable/mac_btn_close"
                  android:clickable="true"
                  android:focusable="true" />

              <ImageView
                  android:id="@+id/hide_button"
                  android:layout_width="12dp"
                  android:layout_height="12dp"
                  android:layout_marginStart="8dp"
                  android:background="@drawable/mac_btn_minimize"
                  android:clickable="true"
                  android:focusable="true" />

              <ImageView
                  android:id="@+id/maximize_button"
                  android:layout_width="12dp"
                  android:layout_height="12dp"
                  android:layout_marginStart="8dp"
                  android:background="@drawable/mac_btn_maximize"
                  android:clickable="true"
                  android:focusable="true" />

              <TextView
                  android:id="@+id/title"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:gravity="center"
                  android:ellipsize="end"
                  android:singleLine="true"
                  android:textColor="#E0E0E0"
                  android:textSize="13sp"
                  android:fontFamily="sans-serif-medium" />
          </LinearLayout>
          EOT

          cat << 'EOT' > app/src/main/java/com/farmerbb/taskbar/util/FreeformWindowManager.java
          package com.farmerbb.taskbar.util;

          import android.app.ActivityOptions;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Rect;
          import android.os.Build;
          import java.util.HashMap;
          import java.util.Map;

          public class FreeformWindowManager {
              private static final Map<String, Rect> savedBoundsMap = new HashMap<>();

              public static void saveWindowBounds(String packageName, Rect bounds) {
                  if (packageName != null && bounds != null) {
                      savedBoundsMap.put(packageName, bounds);
                  }
              }

              public static Rect getSavedBounds(String packageName) {
                  return savedBoundsMap.get(packageName);
              }

              public static void launchOrRestoreFreeform(Context context, Intent intent, Rect defaultBounds) {
                  String pkg = intent.getComponent() != null ? intent.getComponent().getPackageName() : null;
                  Rect bounds = (pkg != null && savedBoundsMap.containsKey(pkg)) ? savedBoundsMap.get(pkg) : defaultBounds;

                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_MULTIPLE_TASK);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      ActivityOptions options = ActivityOptions.makeBasic();
                      if (bounds != null) {
                          options.setLaunchBounds(bounds);
                      }
                      try {
                          context.startActivity(intent, options.toBundle());
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  } else {
                      try {
                          context.startActivity(intent);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }
          }
          EOT

      - name: Commit and Push Code to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix Java compilation errors and apply macOS freeform manager" || echo "No changes to commit"
          git push
          
